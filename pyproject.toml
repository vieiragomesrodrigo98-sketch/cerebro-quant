[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-cerebro"
version = "0.1.0"
description = "Motor de descoberta de oportunidades com disciplina de medicao pre-registrada"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Gomes Vieira" }]
dependencies = ["numpy>=1.26", "pandas>=2.0", "loguru>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Conjunto de regras DECLARADO, nunca herdado do default da versao instalada:
# o default do ruff muda entre versoes, e um portao cuja regua muda sozinha
# aprova hoje o que reprova amanha. Mesma regua do repositorio de origem.
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # linha longa — gerenciada pelo formatter
    "RUF001", # tipografia PT-BR deliberada em strings (—, ·, ×, →)
    "RUF002", # idem em docstrings
    "RUF003", # idem em comentarios
    "UP042",  # (str, Enum) -> StrEnum muda str()/format(); enums sao persistidos
    "N806",   # convencao do projeto: constantes locais de funcao em UPPER_CASE
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
